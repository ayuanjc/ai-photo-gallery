# 云影图鉴 · 活动素材工作流（子域入口）
# 部署：scp 到 /etc/nginx/sites-available/yunying-subdomain 并 ln -s 到 sites-enabled
# 前置：DNS A 记录 yunying.ayuanjc.online -> 106.52.116.164；
#      证书 certbot --nginx -d yunying.ayuanjc.online（首次会自动补 listen 443）
# 注意：本文件不含 default_server —— 裸 IP 的 444 拦截仍由 sites-enabled/probe-block 负责，
#      备案整改结构保持不变。
server {
    listen 80;
    listen [::]:80;
    server_name yunying.ayuanjc.online;

    server_tokens off;
    root /opt/yunying/web;
    index index.html;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header Referrer-Policy no-referrer always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    # 素材包导出是同步 zip 生成，放宽一点别被默认 60s 掐断
    client_max_body_size 2m;

    location /thumbs/ {
        alias /opt/yunying/data/thumbs/;
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        access_log off;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8100;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location / { try_files $uri $uri/ /index.html; }
}
