<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI 图库助手 · 管理控制台</title>
  <style>
    :root {
      --bg: #0a0b0f;
      --bg-grad: radial-gradient(ellipse at top, #12141c 0%, #0a0b0f 60%);
      --card: #14161c;
      --card-2: #1a1d26;
      --card-hover: #1e2230;
      --border: #262a36;
      --border-light: #333846;
      --text: #e8eaef;
      --text-dim: #8b919e;
      --text-faint: #5a5f6e;
      --accent: #5b6cff;
      --accent-2: #7c8bff;
      --accent-glow: rgba(91, 108, 255, 0.15);
      --green: #34d399;
      --green-glow: rgba(52, 211, 153, 0.12);
      --red: #f87171;
      --amber: #fbbf24;
      --radius: 14px;
      --radius-sm: 10px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
      background: var(--bg-grad); color: var(--text);
      min-height: 100vh; -webkit-font-smoothing: antialiased;
    }

    /* ---- Header ---- */
    .header {
      background: rgba(10, 11, 15, 0.82); backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 50;
    }
    .header-inner {
      max-width: 920px; margin: 0 auto; padding: 14px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .logo {
      width: 40px; height: 40px; border-radius: 12px;
      background: linear-gradient(135deg, #fa2921, #ffb400 40%, #1e83f7 75%, #18c249);
      display: flex; align-items: center; justify-content: center;
      font-size: 18px; font-weight: 800; color: #fff; flex-shrink: 0;
      box-shadow: 0 2px 12px rgba(30, 131, 247, 0.25);
    }
    .header-title h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header-title .sub { color: var(--text-dim); font-size: 12px; margin-top: 1px; }
    .header .spacer { flex: 1; }

    /* ---- Buttons ---- */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      background: var(--accent); color: #fff; border: none; border-radius: var(--radius-sm);
      padding: 8px 16px; font-size: 13px; cursor: pointer; font-weight: 600;
      transition: all .15s; white-space: nowrap;
    }
    .btn:hover { background: var(--accent-2); box-shadow: 0 2px 12px var(--accent-glow); }
    .btn:active { transform: scale(0.97); }
    .btn.ghost { background: transparent; border: 1px solid var(--border-light); color: var(--text-dim); }
    .btn.ghost:hover { border-color: var(--accent); color: var(--text); background: var(--accent-glow); box-shadow: none; }
    .btn.green { background: var(--green); color: #062; }
    .btn.green:hover { background: #4ade80; box-shadow: 0 2px 12px var(--green-glow); }
    .btn.immich {
      background: linear-gradient(135deg, #4123d2, #6d28d9); color: #fff;
      border: 1px solid rgba(109, 40, 217, 0.3);
    }
    .btn.immich:hover { background: linear-gradient(135deg, #4f2de0, #7c3aed); box-shadow: 0 2px 12px rgba(109, 40, 217, 0.3); }
    .btn:disabled { opacity: .45; cursor: not-allowed; transform: none; }
    .btn svg { width: 15px; height: 15px; }

    /* ---- Tabs ---- */
    .tabs {
      max-width: 920px; margin: 0 auto; padding: 20px 20px 0;
      display: flex; gap: 4px; border-bottom: 1px solid var(--border);
    }
    .tab {
      padding: 10px 18px; font-size: 14px; font-weight: 600; color: var(--text-dim);
      background: none; border: none; border-bottom: 2px solid transparent;
      cursor: pointer; transition: all .15s; margin-bottom: -1px;
    }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--text); border-bottom-color: var(--accent); }

    /* ---- Main ---- */
    .main { max-width: 920px; margin: 0 auto; padding: 20px; }
    .tab-content { display: none; }
    .tab-content.active { display: block; animation: fadeIn .2s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    /* ---- Cards ---- */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 18px 20px; margin-bottom: 16px;
    }
    .card-title {
      font-size: 13px; color: var(--text-dim); font-weight: 600;
      margin-bottom: 14px; letter-spacing: 0.3px; display: flex; align-items: center; gap: 8px;
    }
    .card-title svg { width: 16px; height: 16px; opacity: 0.7; }

    /* ---- Status grid ---- */
    .status-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 10px; }
    .status-item {
      background: var(--card-2); border-radius: var(--radius-sm); padding: 12px 14px;
      border: 1px solid transparent; transition: border-color .15s;
    }
    .status-item:hover { border-color: var(--border-light); }
    .status-item .k { font-size: 11px; color: var(--text-faint); margin-bottom: 5px; text-transform: uppercase; letter-spacing: 0.5px; }
    .status-item .v { font-size: 15px; font-weight: 600; word-break: break-all; }
    .status-item .v.ok { color: var(--green); }
    .status-item .v.bad { color: var(--red); }
    .status-item .v .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; vertical-align: middle; }
    .status-item .v.ok .dot { background: var(--green); box-shadow: 0 0 6px var(--green); }
    .status-item .v.bad .dot { background: var(--red); box-shadow: 0 0 6px var(--red); }

    /* ---- Feature toggle ---- */
    .feature {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; border-radius: var(--radius-sm); margin-bottom: 8px;
      background: var(--card-2); border: 1px solid transparent;
      transition: all .15s;
    }
    .feature:hover { border-color: var(--border-light); background: var(--card-hover); }
    .feature .info { flex: 1; min-width: 0; }
    .feature .name { font-size: 14.5px; font-weight: 600; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
    .feature .desc { font-size: 12.5px; color: var(--text-dim); margin-top: 3px; line-height: 1.4; }
    .badge {
      font-size: 10px; padding: 2px 8px; border-radius: 20px; font-weight: 600;
      background: rgba(251, 191, 36, 0.1); color: var(--amber);
      border: 1px solid rgba(251, 191, 36, 0.25);
    }
    .badge.off { background: rgba(139, 145, 158, 0.08); color: var(--text-faint); border-color: var(--border); }
    .badge.overridden { background: var(--accent-glow); color: var(--accent-2); border-color: rgba(91, 108, 255, 0.3); }

    .toggle {
      position: relative; width: 44px; height: 24px; border-radius: 24px;
      background: #2a2e3d; cursor: pointer; border: none; flex-shrink: 0;
      transition: background .2s;
    }
    .toggle::after {
      content: ""; position: absolute; top: 3px; left: 3px;
      width: 18px; height: 18px; border-radius: 50%; background: #c0c5d2;
      transition: transform .2s, background .2s;
    }
    .toggle.on { background: var(--green); }
    .toggle.on::after { transform: translateX(20px); background: #fff; }
    .toggle:disabled { opacity: .4; cursor: not-allowed; }

    /* ---- Settings form ---- */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block; font-size: 12.5px; font-weight: 600; color: var(--text-dim);
      margin-bottom: 6px; letter-spacing: 0.2px;
    }
    .form-label .hint { font-weight: 400; color: var(--text-faint); margin-left: 6px; }
    .form-input-wrap { position: relative; display: flex; align-items: center; }
    .form-input {
      background: var(--card-2); border: 1px solid var(--border);
      color: var(--text); border-radius: var(--radius-sm); padding: 10px 14px;
      font-size: 13.5px; outline: none; width: 100%; transition: border-color .15s;
      font-family: inherit;
    }
    .form-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-glow); }
    .form-input::placeholder { color: var(--text-faint); }
    .form-input.has-toggle { padding-right: 44px; }
    .eye-btn {
      position: absolute; right: 8px; background: none; border: none;
      cursor: pointer; color: var(--text-faint); padding: 4px; display: flex;
    }
    .eye-btn:hover { color: var(--text-dim); }
    .eye-btn svg { width: 18px; height: 18px; }
    .form-status { font-size: 11.5px; margin-top: 5px; color: var(--text-faint); }
    .form-status.set { color: var(--green); }
    .form-status.empty { color: var(--amber); }
    .form-actions { display: flex; gap: 10px; margin-top: 20px; align-items: center; }
    .form-hint { font-size: 12px; color: var(--text-faint); flex: 1; }

    .settings-section { margin-bottom: 24px; }
    .settings-section-title {
      font-size: 14px; font-weight: 700; margin-bottom: 12px;
      padding-bottom: 8px; border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 8px;
    }
    .settings-section-title svg { width: 18px; height: 18px; color: var(--accent-2); }

    /* ---- Login mask ---- */
    .mask {
      position: fixed; inset: 0; background: rgba(0, 0, 0, 0.7);
      display: flex; align-items: center; justify-content: center; z-index: 100;
      backdrop-filter: blur(8px); animation: fadeIn .15s;
    }
    .mask .card { width: 360px; margin: 0; }
    .mask .form-actions { margin-top: 16px; }

    /* ---- Toast ---- */
    .toast {
      position: fixed; bottom: 28px; left: 50%; transform: translateX(-50%) translateY(10px);
      background: var(--card); border: 1px solid var(--border-light); color: var(--text);
      padding: 11px 20px; border-radius: var(--radius-sm); font-size: 13.5px; z-index: 200;
      opacity: 0; transition: all .25s; pointer-events: none;
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.4); font-weight: 500;
    }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
    .toast.err { border-color: var(--red); color: var(--red); }
    .toast.ok { border-color: var(--green); color: var(--green); }

    .hidden { display: none !important; }
    .loading { color: var(--text-faint); font-size: 13px; }
  </style>
</head>
<body>
  <div class="header">
    <div class="header-inner">
      <div class="logo">AI</div>
      <div class="header-title">
        <h1>AI 图库助手</h1>
        <div class="sub">管理控制台</div>
      </div>
      <div class="spacer"></div>
      <button class="btn immmich" id="immichBtn" title="在新窗口打开 Immich 图库">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6"/><path d="M10 14L21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
        打开 Immich
      </button>
      <button class="btn ghost" id="logoutBtn" title="退出管理控制台">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
        退出
      </button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" data-tab="features">功能开关</button>
    <button class="tab" data-tab="status">系统状态</button>
    <button class="tab" data-tab="settings">设置</button>
  </div>

  <div class="main">
    <div class="tab-content active" id="tab-features">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M9 12l2 2 4-4"/><circle cx="12" cy="12" r="10"/></svg>
          功能开关
        </div>
        <div id="featureList" class="loading">加载中…</div>
      </div>
    </div>

    <div class="tab-content" id="tab-status">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></svg>
          系统状态
        </div>
        <div class="status-grid" id="statusGrid"><span class="loading">加载中…</span></div>
      </div>
    </div>

    <div class="tab-content" id="tab-settings">
      <div class="card">
        <div class="card-title">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
          配置管理
        </div>

        <div class="settings-section">
          <div class="settings-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="2" y="2" width="20" height="20" rx="5"/><path d="M2 12h20"/></svg>
            Immich 连接
          </div>
          <div class="form-group">
            <label class="form-label">Immich 地址 <span class="hint">（如 http://127.0.0.1:3200）</span></label>
            <div class="form-input-wrap">
              <input class="form-input" type="text" id="setting_immich_base_url" placeholder="http://127.0.0.1:3200" />
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Immich API Key</label>
            <div class="form-input-wrap">
              <input class="form-input has-toggle" type="password" id="setting_immich_api_key" placeholder="填入 Immich API Key" />
              <button class="eye-btn" data-target="setting_immich_api_key" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="form-status" id="status_immich_api_key"></div>
          </div>
        </div>

        <div class="settings-section">
          <div class="settings-section-title">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
            鉴权密钥
          </div>
          <div class="form-group">
            <label class="form-label">搜索接口 API Key <span class="hint">（SEARCH_API_KEY，空 = 不鉴权）</span></label>
            <div class="form-input-wrap">
              <input class="form-input has-toggle" type="password" id="setting_search_api_key" placeholder="留空 = 不启用鉴权" />
              <button class="eye-btn" data-target="setting_search_api_key" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="form-status" id="status_search_api_key"></div>
          </div>
          <div class="form-group">
            <label class="form-label">管理页面密钥 <span class="hint">（ADMIN_API_KEY，空 = 开发环境免密钥）</span></label>
            <div class="form-input-wrap">
              <input class="form-input has-toggle" type="password" id="setting_admin_api_key" placeholder="留空 = 开发环境免密钥" />
              <button class="eye-btn" data-target="setting_admin_api_key" type="button">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
              </button>
            </div>
            <div class="form-status" id="status_admin_api_key"></div>
          </div>
        </div>

        <div class="form-actions">
          <button class="btn green" id="saveSettingsBtn">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"/><polyline points="17 21 17 13 7 13 7 21"/><polyline points="7 3 7 8 15 8"/></svg>
            保存配置
          </button>
          <span class="form-hint">保存后写入 .env 文件，需重启服务生效</span>
        </div>
      </div>
    </div>
  </div>

  <div class="mask hidden" id="loginMask">
    <div class="card">
      <div class="card-title">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
        管理员登录
      </div>
      <div class="form-group">
        <div class="form-input-wrap">
          <input class="form-input" type="password" id="keyInput" placeholder="输入管理员密钥" style="text-align: center" />
        </div>
      </div>
      <div class="form-actions">
        <button class="btn" id="loginBtn" style="flex:1; justify-content: center">进入控制台</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  var KEY_STORAGE = "a01_admin_key";
  var $ = function (id) { return document.getElementById(id); };
  var headers = function () {
    var k = localStorage.getItem(KEY_STORAGE);
    return k ? { "x-admin-key": k } : {};
  };

  function toast(msg, type) {
    var t = $("toast");
    t.textContent = msg;
    t.className = "toast show" + (type ? " " + type : "");
    setTimeout(function () { t.className = "toast" + (type ? " " + type : ""); }, 2400);
  }

  async function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.method || "GET", headers: Object.assign({ "Content-Type": "application/json" }, headers()) };
    if (opts.body) init.body = JSON.stringify(opts.body);
    var resp = await fetch(path, init);
    if (resp.status === 401) { showLogin(); throw new Error("需要管理员密钥"); }
    var data = await resp.json().catch(function () { return {}; });
    if (!resp.ok) throw new Error((data.error && data.error.message) || ("HTTP " + resp.status));
    return data;
  }

  /* ---- Tabs ---- */
  document.querySelectorAll(".tab").forEach(function (tab) {
    tab.addEventListener("click", function () {
      document.querySelectorAll(".tab").forEach(function (t) { t.classList.remove("active"); });
      document.querySelectorAll(".tab-content").forEach(function (c) { c.classList.remove("active"); });
      tab.classList.add("active");
      $("tab-" + tab.dataset.tab).classList.add("active");
    });
  });

  /* ---- Eye toggle ---- */
  document.querySelectorAll(".eye-btn").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var input = $(btn.dataset.target);
      input.type = input.type === "password" ? "text" : "password";
    });
  });

  /* ---- Status ---- */
  function fmtUptime(s) {
    if (s < 60) return s + " 秒";
    if (s < 3600) return Math.round(s / 60) + " 分钟";
    if (s < 86400) return (s / 3600).toFixed(1) + " 小时";
    return (s / 86400).toFixed(1) + " 天";
  }

  function renderStatus(st) {
    var items = [
      { k: "应用环境", v: st.app_env },
      { k: "服务版本", v: "v" + st.version },
      { k: "运行时长", v: fmtUptime(st.uptime_seconds) },
      { k: "Immich 连接", v: st.immich_connected ? '<span class="dot"></span>已连接' : '<span class="dot"></span>未连接', cls: st.immich_connected ? "ok" : "bad" },
      { k: "Immich 地址", v: st.immich_base_url },
      { k: "缓存后端", v: st.cache_backend },
      { k: "功能启用", v: st.features_enabled + " / " + st.features_total }
    ];
    $("statusGrid").innerHTML = items.map(function (it) {
      return '<div class="status-item"><div class="k">' + it.k + '</div><div class="v ' + (it.cls || "") + '">' + it.v + "</div></div>";
    }).join("");
  }

  /* ---- Features ---- */
  function renderFeatures(features) {
    var keys = Object.keys(features);
    if (!keys.length) { $("featureList").innerHTML = '<span class="loading">无功能开关</span>'; return; }
    var html = keys.map(function (key) {
      var f = features[key];
      var badges = "";
      if (f.requires_restart) badges += '<span class="badge">需重启</span>';
      if (f.overridden) badges += '<span class="badge overridden">已覆盖</span>';
      if (!f.enabled && !f.requires_restart) badges += '<span class="badge off">已关闭</span>';
      return '<div class="feature" data-key="' + key + '">' +
        '<div class="info"><div class="name">' + f.name + " " + badges + '</div><div class="desc">' + f.description + "</div></div>" +
        '<button class="toggle' + (f.enabled ? " on" : "") + '" data-key="' + key + '" aria-label="' + f.name + '"></button>' +
        "</div>";
    }).join("");
    $("featureList").innerHTML = html;

    Array.prototype.forEach.call($("featureList").querySelectorAll(".toggle"), function (btn) {
      btn.addEventListener("click", function () { toggleFeature(btn); });
    });
  }

  async function toggleFeature(btn) {
    var key = btn.dataset.key;
    var enable = !btn.classList.contains("on");
    btn.disabled = true;
    try {
      var o; var data = await api("/admin/api/features", { method: "PUT", body: { updates: (o = {}, o[key] = enable, o) } });
      renderFeatures(data.features);
      toast(enable ? "已开启" : "已关闭", "ok");
    } catch (e) {
      toast(e.message, "err");
      btn.disabled = false;
    }
  }

  /* ---- Settings ---- */
  async function loadSettings() {
    try {
      var data = await api("/admin/api/settings");
      var s = data.settings;
      $("setting_immich_base_url").value = s.immich_base_url.value || "";
      $("setting_immich_api_key").value = "";
      $("setting_search_api_key").value = "";
      $("setting_admin_api_key").value = "";

      setSettingStatus("immich_api_key", s.immich_api_key);
      setSettingStatus("search_api_key", s.search_api_key);
      setSettingStatus("admin_api_key", s.admin_api_key);
    } catch (e) {
      if (e.message !== "需要管理员密钥") toast(e.message, "err");
    }
  }

  function setSettingStatus(key, info) {
    var el = $("status_" + key);
    if (info.is_set) {
      el.textContent = "当前: " + info.value;
      el.className = "form-status set";
    } else {
      el.textContent = "未设置";
      el.className = "form-status empty";
    }
  }

  async function saveSettings() {
    var updates = {};
    var url = $("setting_immich_base_url").value.trim();
    if (url) updates.immich_base_url = url;
    var ik = $("setting_immich_api_key").value.trim();
    if (ik) updates.immich_api_key = ik;
    var sk = $("setting_search_api_key").value.trim();
    if (sk) updates.search_api_key = sk;
    var ak = $("setting_admin_api_key").value.trim();
    if (ak) updates.admin_api_key = ak;

    if (!Object.keys(updates).length) { toast("没有需要保存的更改", "err"); return; }

    var btn = $("saveSettingsBtn");
    btn.disabled = true;
    try {
      await api("/admin/api/settings", { method: "PUT", body: { updates: updates } });
      toast("配置已保存，重启服务后生效", "ok");
      loadSettings();
    } catch (e) {
      toast(e.message, "err");
    } finally {
      btn.disabled = false;
    }
  }

  /* ---- Load all ---- */
  async function load() {
    try {
      var st = await api("/admin/api/status");
      renderStatus(st);
      var f = await api("/admin/api/features");
      renderFeatures(f.features);
      $("loginMask").classList.add("hidden");

      $("immichBtn").onclick = function () { window.open(st.immich_base_url, "_blank"); };

      loadSettings();
    } catch (e) {
      if (e.message !== "需要管理员密钥") toast(e.message, "err");
    }
  }

  function showLogin() {
    $("loginMask").classList.remove("hidden");
    $("keyInput").value = "";
    setTimeout(function () { $("keyInput").focus(); }, 50);
  }

  async function tryLogin() {
    var key = $("keyInput").value.trim();
    if (!key) { toast("请输入管理员密钥", "err"); return; }
    try {
      var r = await fetch("/admin/api/verify", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ admin_key: key }) });
      var data = await r.json().catch(function () { return {}; });
      if (!r.ok) throw new Error((data.error && data.error.message) || "密钥错误");
      localStorage.setItem(KEY_STORAGE, key);
      $("loginMask").classList.add("hidden");
      load();
      toast("登录成功", "ok");
    } catch (e) {
      toast(e.message, "err");
    }
  }

  $("loginBtn").addEventListener("click", tryLogin);
  $("keyInput").addEventListener("keydown", function (e) { if (e.key === "Enter") tryLogin(); });
  $("logoutBtn").addEventListener("click", function () {
    localStorage.removeItem(KEY_STORAGE);
    showLogin();
  });
  $("saveSettingsBtn").addEventListener("click", saveSettings);

  load();
})();
</script>
</body>
</html>
